name: Translate reports to Chinese

on:
  workflow_run:
    workflows:
      - Extract Reddit value report
    types:
      - completed
  schedule:
    # Recovery run in case the analysis completion trigger was delayed or skipped.
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: Optional published report date to translate (YYYY-MM-DD).
        required: false
        type: string
      limit:
        description: Maximum number of overlays produced in one run.
        required: false
        default: "5"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "5"
          - "10"
      force:
        description: Retranslate overlays that already match their source report.
        required: false
        default: false
        type: boolean
      prepare_only:
        description: Build the translation sandbox without invoking Copilot or committing overlays.
        required: false
        default: false
        type: boolean
      model:
        description: Copilot model used for translation.
        required: false
        default: gemini-3.8-flash
        type: choice
        options:
          - gemini-3.8-flash
          - gpt-5.4-mini
          - grok-4.5
          - claude-sonnet-5
          - gpt-5.6-terra
      effort:
        description: Reasoning effort passed to Copilot CLI; auto uses a model-compatible default.
        required: false
        default: auto
        type: choice
        options:
          - auto
          - medium
          - high
          - xhigh
      workers:
        description: Maximum number of overlays generated concurrently.
        required: false
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"

concurrency:
  group: reddit-translate-zh
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "pipeline/uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Python pipeline
        run: uv sync --frozen
        working-directory: pipeline

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install Copilot CLI
        run: npm install --global @github/copilot@1.0.88

      - name: Translate published reports
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
          TRANSLATION_DATE: ${{ inputs.date }}
          TRANSLATION_LIMIT: ${{ inputs.limit || '5' }}
          FORCE_TRANSLATIONS: ${{ inputs.force || false }}
          PREPARE_ONLY: ${{ inputs.prepare_only || false }}
          COPILOT_MODEL: ${{ inputs.model || 'gemini-3.8-flash' }}
          COPILOT_EFFORT_INPUT: ${{ inputs.effort || 'auto' }}
          TRANSLATION_WORKERS: ${{ inputs.workers || '1' }}
          PYTHONUNBUFFERED: "1"
        run: |
          if [[ "$COPILOT_EFFORT_INPUT" == "auto" ]]; then
            case "$COPILOT_MODEL" in
              gemini-*|gpt-5.4-mini) COPILOT_EFFORT=medium ;;
              grok-*|claude-*) COPILOT_EFFORT=high ;;
              *) COPILOT_EFFORT=high ;;
            esac
          else
            COPILOT_EFFORT="$COPILOT_EFFORT_INPUT"
          fi
          args=(translate-zh --model "$COPILOT_MODEL" --effort "$COPILOT_EFFORT" --workers "$TRANSLATION_WORKERS" --limit "$TRANSLATION_LIMIT")
          if [[ -n "$TRANSLATION_DATE" ]]; then
            args+=(--date "$TRANSLATION_DATE")
          fi
          if [[ "$FORCE_TRANSLATIONS" == "true" ]]; then
            args+=(--force)
          fi
          if [[ "$PREPARE_ONLY" == "true" ]]; then
            args+=(--prepare-only)
          fi
          if ! uv run --frozen "${args[@]}"; then
            if [[ "$COPILOT_MODEL" == "gpt-5.4-mini" || "$PREPARE_ONLY" == "true" ]]; then
              exit 1
            fi
            echo "::warning::Quality-first translation failed validation; retrying with gpt-5.4-mini/high."
            fallback=(translate-zh --model gpt-5.4-mini --effort high --workers "$TRANSLATION_WORKERS" --limit "$TRANSLATION_LIMIT")
            if [[ -n "$TRANSLATION_DATE" ]]; then fallback+=(--date "$TRANSLATION_DATE"); fi
            if [[ "$FORCE_TRANSLATIONS" == "true" ]]; then fallback+=(--force); fi
            uv run --frozen "${fallback[@]}"
          fi
        working-directory: pipeline

      - name: Upload failed translation diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: reddit-translation-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            pipeline/artifacts/translations/zh/**/translation.md
            pipeline/artifacts/translations/zh/**/structure.json
            pipeline/artifacts/translations/zh/**/protected-terms.json
            pipeline/artifacts/translations/zh/**/prompt.txt
            pipeline/artifacts/translations/zh/**/validation-errors.json
            pipeline/artifacts/translations/zh/**/validation-warnings.json
            pipeline/artifacts/translations/zh/**/generation-metadata.json
            pipeline/artifacts/translations/zh/**/copilot.stdout.log
            pipeline/artifacts/translations/zh/**/copilot.stderr.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload translation telemetry
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: reddit-translation-telemetry-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            pipeline/artifacts/translations/zh/**/generation-metadata.json
            pipeline/artifacts/translations/zh/**/validation-warnings.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Commit validated translations
        if: ${{ always() && !cancelled() && inputs.prepare_only != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/reddit/zh/
          if git diff --cached --quiet; then
            echo "No new Chinese overlays to commit."
            exit 0
          fi

          git commit -m "reddit intelligence zh: $(date -u +%Y-%m-%dT%H:%MZ)"
          branch="$GITHUB_REF_NAME"
          for attempt in 1 2 3; do
            git fetch origin "$branch"
            git rebase "origin/$branch"
            if git push origin "HEAD:$branch"; then
              exit 0
            fi
            echo "Push attempt $attempt failed; rebasing and retrying."
          done
          echo "Unable to push Chinese overlays after 3 attempts."
          exit 1
